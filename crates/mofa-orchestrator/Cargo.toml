[package]
name = "mofa-orchestrator"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tracing = "0.1"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
futures = "0.3"
semver = "1.0"
regex = "1"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
parking_lot = "0.12"
base64 = "0.22"
thiserror-impl = { version = "1.0", optional = true }

mofa-kernel = { path = "../mofa-kernel" }
mofa-foundation = { path = "../mofa-foundation" }
mofa-runtime = { path = "../mofa-runtime" }
mofa-sdk = { path = "../mofa-sdk" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time"] }
serde_json = "1.0"

[features]
default = []
semantic = []
marketplace = []
notifications-slack = []
notifications-telegram = []
notifications-email = []
notifications-dingtalk = []
rest = []
bm25 = []
